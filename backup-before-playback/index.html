<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chant Sight-Singing Trainer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- pdf.js (UMD) — stable vanilla build, no bundler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header class="toolbar" role="banner">
    <div class="toolbar-group toolbar-files">
      <label class="file-btn">
        PDF
        <input type="file" id="pdf-input" accept="application/pdf,.pdf" hidden />
      </label>
      <label class="file-btn">
        Score
        <input type="file" id="score-input" accept="application/json,.json" hidden />
      </label>
      <span id="file-status" class="file-status" aria-live="polite">No PDF loaded</span>
    </div>

    <div class="toolbar-group toolbar-audio">
      <button type="button" id="mic-btn" class="btn" aria-pressed="false" title="Microphone on/off">
        Mic Off
      </button>
      <div id="pitch-readout" class="pitch-readout" title="Live pitch (debug)" aria-live="polite">
        <span id="pitch-note" class="pitch-note">—</span>
        <div id="pitch-bar" class="pitch-bar" aria-hidden="true">
          <span class="pitch-bar-center"></span>
          <span id="pitch-needle" class="pitch-needle"></span>
        </div>
      </div>
      <button type="button" id="mode-btn" class="btn" data-mode="absolute" title="Pitch mode">
        Absolute
      </button>
      <label class="slider-label" title="Pitch tolerance in cents">
        Sens
        <input type="range" id="sensitivity" min="20" max="100" value="50" step="1" />
        <span id="sensitivity-val">50¢</span>
      </label>
      <label class="slider-label" title="Hold time before advancing">
        Hold
        <input type="range" id="advance-hold" min="100" max="800" value="300" step="10" />
        <span id="advance-hold-val">300ms</span>
      </label>
    </div>

    <div class="toolbar-group toolbar-note">
      <div id="current-note" class="current-note" aria-live="polite" title="Target note">—</div>
      <button type="button" id="start-over-btn" class="btn" title="Reset to first note">Start over</button>
    </div>

    <div class="toolbar-group toolbar-nav">
      <button type="button" id="prev-page" class="btn" aria-label="Previous page">‹</button>
      <span id="page-label" class="page-label">— / —</span>
      <button type="button" id="next-page" class="btn" aria-label="Next page">›</button>
    </div>
  </header>

  <div id="mic-error" class="mic-error" hidden role="alert"></div>

  <main id="stage" class="stage" role="main">
    <div id="drop-hint" class="drop-hint">
      Drop a PDF here, or use the PDF button above.
      <br />
      <small>Optionally load a matching <code>score.json</code> for note markers.</small>
    </div>
    <div id="canvas-wrap" class="canvas-wrap" hidden>
      <canvas id="page"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="follow.js"></script>
  <!-- ESM: pitchy + mic / PitchDetector loop -->
  <script type="module" src="pitch.js"></script>
</body>
</html>
